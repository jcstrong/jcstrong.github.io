name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [homepage]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage source
        uses: actions/checkout@v4

      # master 分支是 PicGo 图床，笔记引用 https://jcstrong.github.io/img/...
      # 构建时把图床目录捎带进部署产物，保证笔记内图片 URL 不变（master 本身零改动）
      - name: Checkout image-bed (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: imgbed

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        run: npm run build

      - name: Merge image-bed assets into dist
        run: |
          for dir in img 2021 archives fonts; do
            if [ -d "imgbed/$dir" ]; then
              cp -r "imgbed/$dir" dist/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
